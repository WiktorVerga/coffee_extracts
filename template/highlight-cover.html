<!doctype html>
<html lang="en" data-mode="preview">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlight covers</title>
<!--
  HIGHLIGHT COVERS (1080 × 1920, Instagram shows only the center circle)
  ------------------------------------------------------------------
  How to edit it by hand:
  1. Colors and icon size: change the variables in ":root" below.
  2. Icons: each one is a small SVG in the ICONS object in the script
     (viewBox 0 0 200 200). Edit or replace the drawing there.
  3. Preview: open this file in a browser. The dashed circle shows what
     Instagram will display. It is NOT in the exported images.
  4. Which covers exist comes from highlights/highlights.json ("icon" of each group).
-->
<style>
@font-face {
  font-family: "Archivo Black";
  src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
  font-display: block;
}
:root {
  --cover-bg:    #413125;  /* background (espresso)              */
  --icon-color:  #EFD6B4;  /* lines of the icon (hazel)          */
  --icon-accent: #b39977;  /* filled parts of the icon (crema)   */
  --icon-size:   540px;    /* size of the icon in the center     */
  --stroke:      11;       /* line thickness (in icon units)     */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #1a0f0a; }
html[data-mode="preview"] body { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
html[data-mode="preview"] .cover { zoom: .25; }

.cover {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: var(--cover-bg); color: var(--icon-color);
  display: grid; place-items: center;
}
.cover svg { width: var(--icon-size); height: var(--icon-size); overflow: visible; }
.cover svg .line { fill: none; stroke: currentColor; stroke-width: var(--stroke); stroke-linecap: round; stroke-linejoin: round; }
.cover svg .fill { fill: var(--icon-accent); stroke: none; }
.cover svg text { font-family: "Archivo Black", Arial, sans-serif; fill: var(--icon-accent); }

.guide { display: none; }
html[data-mode="preview"] .guide {
  display: block; position: absolute; width: 1000px; height: 1000px; left: 40px; top: 460px;
  border-radius: 50%; border: 6px dashed rgba(200, 60, 60, .7);
}
</style>
</head>
<body>

<!-- EXAMPLE DATA. The render script replaces this block. -->
<script id="data" type="application/json">
{ "covers": [ { "id": "start", "icon": "start" }, { "id": "moka", "icon": "moka" }, { "id": "espresso", "icon": "espresso" }, { "id": "gear", "icon": "gear" }, { "id": "qa", "icon": "qa" } ] }
</script>

<script>
(function () {
  // Original line icons, drawn for this page (viewBox 0 0 200 200).
  const ICONS = {
    // the page's signature: a cup of espresso seen from above
    start: `
      <circle class="line" cx="96" cy="100" r="64"/>
      <circle class="fill" cx="96" cy="100" r="46"/>
      <path class="line" d="M160 100 h24"/>`,
    // moka pot, side view
    moka: `
      <path class="line" d="M64 48 H136 L118 100 H82 Z"/>
      <path class="line" d="M84 108 H116 L140 170 H60 Z"/>
      <path class="line" d="M78 104 H122"/>
      <circle class="fill" cx="100" cy="36" r="8"/>
      <path class="line" d="M64 48 L46 40 L70 66"/>
      <path class="line" d="M134 56 H158 L150 92 H124"/>`,
    // espresso cup on a saucer, with steam
    espresso: `
      <path class="line" d="M84 58 q-10 -12 0 -24 M104 58 q-10 -12 0 -24 M124 58 q-10 -12 0 -24"/>
      <path class="line" d="M58 78 H142 V108 Q142 150 100 150 Q58 150 58 108 Z"/>
      <path class="line" d="M142 90 Q170 90 168 112 Q166 130 142 130"/>
      <path class="line" d="M36 166 H164"/>
      <path class="fill" d="M66 86 H134 V100 H66 Z"/>`,
    // hand grinder: the gear that matters most
    gear: `
      <path class="line" d="M100 76 V44 H150"/>
      <rect class="fill" x="142" y="24" width="18" height="36" rx="9"/>
      <rect class="line" x="64" y="76" width="72" height="16" rx="6"/>
      <rect class="line" x="72" y="92" width="56" height="80" rx="10"/>
      <path class="line" d="M72 128 H128"/>`,
    // speech bubble with a question mark
    qa: `
      <path class="line" d="M48 58 Q48 40 66 40 H134 Q152 40 152 58 V112 Q152 130 134 130 H94 L64 156 V130 Q48 130 48 112 Z"/>
      <text x="100" y="112" text-anchor="middle" font-size="70">?</text>`
  };

  const data = JSON.parse(document.getElementById("data").textContent);
  const problems = [];
  data.covers.forEach(c => {
    const svg = ICONS[c.icon];
    if (!svg) { problems.push(`Cover "${c.id}": icon "${c.icon}" doesn't exist. Available: ${Object.keys(ICONS).join(", ")}`); return; }
    const el = document.createElement("section");
    el.className = "cover";
    el.dataset.id = c.id;
    el.innerHTML = `<svg viewBox="0 0 200 200" aria-hidden="true">${svg}</svg><div class="guide"></div>`;
    document.body.appendChild(el);
  });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    window.__REPORT = { ok: problems.length === 0, problems };
    document.documentElement.dataset.ready = "1";
  });
})();
</script>
</body>
</html>
