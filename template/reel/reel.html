<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Reel</title>
<!--
  ANIMATED REEL TEMPLATE (1080 x 1920, 9:16), rendered with HyperFrames.
  ------------------------------------------------------------------
  Do NOT edit by hand for a single post: scripts/reel_animated/build_reel.py
  fills the {{...}} placeholders for every reel.

  - The colors, fonts and slide markup come from template/carousel.html
    (injected at build time), so the reel always looks like the carousel.
  - Only the reel-specific differences live here: the 9:16 frame, the Instagram
    safe zones, the motion (GSAP timeline) and the audio track.
-->
<script src="gsap.min.js"></script>
<style>
{{CAROUSEL_CSS}}

/* ── Reel-specific overrides ───────────────────────────────── */
html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #1a0f0a; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1a0f0a; }
#stage { position: absolute; inset: 0; overflow: hidden; }

.slide {
  position: absolute; left: 0; top: 0;
  width: 1080px; height: 1920px;
  opacity: 0;
  will-change: transform, opacity;
}

/* Instagram covers the top ~250px and the bottom ~420px with its own UI */
:root { --safe-top: 250px; --safe-bottom: 430px; }
.content { top: var(--safe-top); bottom: var(--safe-bottom); }
.footer { display: none; }

.t-tip .cup { top: var(--safe-top); }
.t-compare .content.top { top: var(--safe-top); bottom: calc(50% + 48px); }
.t-compare .content.bottom { top: calc(50% + 80px); bottom: var(--safe-bottom); }


/* Bigger type than the carousel: a reel is watched at arm's length, in motion */
:root {
  --t-cover: 196px; --t-title: 116px; --t-number: 460px; --t-body: 66px; --t-small: 40px;
  --margin: 90px;
}
.label { margin-bottom: 44px; }
.title { margin-bottom: 56px; }
.t-cover .cup { width: 820px; height: 820px; right: -330px; top: -90px; }
.t-cover .content { top: 600px; }
.t-cover .subtitle { font-size: 62px; max-width: 20ch; }
.t-text .highlight { font-size: 66px; max-width: 22ch; border-left-width: 12px; }
.t-number .unit { font-size: 150px; }
.t-steps li { font-size: 58px; grid-template-columns: 116px 1fr; padding: 40px 0; }
.t-steps li::before { font-size: 82px; }
.t-compare .col h3 { font-size: 92px; margin-bottom: 26px; }
.t-compare .col p { font-size: 54px; }
.t-myth .myth { font-size: 112px; }
.t-myth .verdict { font-size: 124px; }
.t-tip .cup { width: 340px; height: 340px; }
.t-tip .body { font-size: 84px; }
.t-closing .title { font-size: 124px; }
.t-closing .cta { font-size: 60px; padding: 28px 52px 30px; }
.t-closing .cup { width: 620px; height: 620px; top: -130px; }

/* Transition wipes (coffee colors) sweep across the frame at every cut */
.wipe { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 50; }
.wipe.w0 { background: var(--crema); }
.wipe.w1 { background: var(--espresso); }
.wipe.w2 { background: var(--hazel-2); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
  <div id="stage"></div>
  <div class="wipe w0"></div>
  <div class="wipe w1"></div>
  <div class="wipe w2"></div>
</div>
<audio id="mix" src="mix.wav" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>

<script>
(function () {
  const PLAN = {{PLAN_JSON}};
  const total = PLAN.slides.length;
  const handle = PLAN.handle || "";
  const DARK = new Set(["cover", "tip", "closing"]);

  {{CAROUSEL_JS_TYPES}}

  const problems = [];
  const stage = document.getElementById("stage");

  PLAN.slides.forEach((s, i) => {
    const make = types[s.type];
    if (!make) { problems.push(`Slide ${i + 1}: unknown type "${s.type}"`); return; }
    const el = document.createElement("section");
    el.className = `slide t-${s.type}` + (DARK.has(s.type) ? " dark" : "")
      + (s.type === "myth" && String(s.verdict).toLowerCase() !== "true" ? " is-false" : "");
    el.dataset.index = i + 1;
    el.innerHTML = `
      <div class="level"><i style="height:${((i + 1) / total * 100).toFixed(2)}%"></i></div>
      ${make(s)}`;
    stage.appendChild(el);
  });

  {{CAROUSEL_JS_FIT}}

  // Which elements of each slide type appear one after the other.
  // MUST match reveal_count() in build_reel.py (it decides when the ticks sound).
  const REVEAL = {
    cover: ".label, .title, .subtitle",
    text: ".title, .body, .highlight",
    number: ".title, .number, .body",
    steps: ".title, li",
    compare: ".title, .col",
    myth: ".label, .myth, .verdict, .body",
    tip: ".label, .body",
    closing: ".title, .body, .cta"
  };
  const POP = ".number, .verdict, .cta, .highlight";

  function buildTimeline() {
    const tl = gsap.timeline({ paused: true });
    const slides = [...document.querySelectorAll(".slide")];
    const wipes = [...document.querySelectorAll(".wipe")];

    slides.forEach((el, i) => {
      const sc = PLAN.scenes[i];
      const type = PLAN.slides[i].type;

      // The scene is visible from its start to the start of the next one.
      // The swap happens under the middle of the wipe, so the cut is hidden.
      tl.set(el, { opacity: 1 }, sc.start);
      if (i < slides.length - 1) tl.set(el, { opacity: 0 }, sc.start + sc.dur);

      // Slow push-in on the whole scene: nothing is ever static
      tl.fromTo(el, { scale: 1 }, { scale: 1.06, duration: sc.dur + 0.3, ease: "none", transformOrigin: "50% 50%" }, sc.start);

      // The cup "fills" as the reel goes on (same bar as the carousel)
      const bar = el.querySelector(".level > i");
      if (bar) tl.fromTo(bar, { height: (i / total * 100) + "%" }, { height: ((i + 1) / total * 100) + "%", duration: 0.5, ease: "power2.out" }, sc.start);

      el.querySelectorAll(".cup").forEach(c =>
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, sc.start));

      [...el.querySelectorAll(REVEAL[type] || ".title")].forEach((it, j) => {
        const t0 = sc.start + sc.first + j * sc.step;
        if (it.matches(POP)) {
          tl.fromTo(it, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)", transformOrigin: "0% 60%" }, t0);
        } else {
          tl.fromTo(it, { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t0);
        }
      });

      // Wipe: starts 0.22s before the cut, covers the frame exactly at the cut
      if (i > 0) {
        const w = wipes[(i - 1) % wipes.length];
        tl.fromTo(w, { y: 1920 }, { y: -1920, duration: 0.44, ease: "power2.inOut" }, sc.start - 0.22);
      }
    });

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  }

  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    fit();
    buildTimeline();
    window.__REPORT.timeline = true;
  });
})();
</script>
</body>
</html>
